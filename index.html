<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Odin</title>
</head>
<body>
    <div class="pic">
        <div class="odin">
            <div><img src="./images/Dropped Image.png" alt="The Odin Logo"></div>
             <div class="norse">ODIN</div>
            </div>
        <div>Photo by <a href="https://unsplash.com/@haliewestphoto">Haile West</a> on <a href="https://unsplash.com/">Unsplah</a></div>
    </div>
    <div class="main">
        <form action="" method=""></form>
        <div class="second un" >
            <div><p>This is not a real online service! You know you need something<br>
                like this in your life to help you realize your deepest dreams.<br>
                <span>Sign up <em>now</em> to get started.</span>
            </p></div>
            <br>
            <div>
                You <em>know</em> you want to.
            </div>
        </div>
        <div class="second deux">
            <div><p> Let's do this!</p></div>
            <div class="form" id="formy">
                
                    <div class="outer">
                        <div class="inner one">
                            <div class="fills">
                                <label for="first-name">FIRST NAME</label>
                                <input type="text" name="first-name" id="first-name" required>
                            </div>
                            <div class="fills">
                                <label for="email">EMAIL</label>
                                <input type="email" name="email" id="email" required>
                            </div>
                            <div class="fills">
                                <label for="password">PASSWORD</label>
                                <input type="password" name="password" id="password" required>
                            </div>
                        </div>
                        <div class="inner two">
                            <div class="fills">
                                <label for="last-name">LAST NAME</label>
                                <input type="text" name="last-name" id="last-name" required>
                            </div>
                            <div class="fills">
                                <label for="telephone">PHONE NUMBER</label>
                                <input type="tel" name="telephone" id="telephone" required>
                            </div>
                            <div class="fills">
                                <label for="confirm">CONFIRM PASSWORD</label>
                                <input type="password" name="confirm" id="confirm" required>
                            </div>
                        </div>
                    </div>
                
            </div>
        </div>
        <div class="second trois">
            <div class="btn">
                <button class="create" form="formy" type="submit"> Create Account</button>
            </div>
            <div class="question">
                <p>Already have an account? <span>Log in</span></p>
            </div>
        </div>
    </div>
</body>
</html>
